name: Pipeline

env:
  DOCKER_REGISTRY: rg.fr-par.scw.cloud/cr-cca-demo

on:
  push:
    branches: ["main"]

  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  tag:
    name: "Tag repo"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
      - name: Conventional Changelog Action
        id: conventional_changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          preset: conventionalcommits
          github-token: ${{ secrets.github_token }}
          skip-commit: true
    outputs:
      version: ${{ steps.conventional_changelog.outputs.version }}

  integration:
    name: Playwright integration tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated Compose integration suite
        run: |
          status=0
          docker compose -p recoverboard-test -f src/docker-compose.yaml -f compose.test.yaml --profile integration up --build -d app || status=$?
          if [ "$status" -eq 0 ]; then
            docker compose -p recoverboard-test -f src/docker-compose.yaml -f compose.test.yaml --profile integration run --build --no-deps --rm playwright npm run test:integration || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            bash scripts/test-task-persistence.sh recoverboard-test || status=$?
          fi
          docker compose -p recoverboard-test -f src/docker-compose.yaml -f compose.test.yaml --profile integration logs > integration-compose.log || true
          exit "$status"
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-integration
          path: |
            artifacts/playwright/
            integration-compose.log
          if-no-files-found: warn
      - name: Clean up test environment
        if: always()
        run: docker compose -p recoverboard-test -f src/docker-compose.yaml -f compose.test.yaml --profile integration down -v --remove-orphans

  docker:
    runs-on: ubuntu-latest
    needs: [tag, integration]
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}
      - name: Set tags
        id: set_docker_tags
        env:
          container_registry: ${{ env.DOCKER_REGISTRY }}
        run: |
          echo "docker_tag_sha=$container_registry/api:${{ needs.tag.outputs.version }}" >> $GITHUB_OUTPUT
          echo "docker_tag_latest=$container_registry/api:latest" >> $GITHUB_OUTPUT
          echo "migration_tag=$container_registry/migrations:${{ needs.tag.outputs.version }}" >> $GITHUB_OUTPUT
      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.set_docker_tags.outputs.docker_tag_sha }}
            ${{ steps.set_docker_tags.outputs.docker_tag_latest }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - name: Build and push migration image
        uses: docker/build-push-action@v6
        with:
          context: ./src
          file: ./src/Dockerfile.migrations
          platforms: linux/amd64
          push: true
          tags: ${{ steps.set_docker_tags.outputs.migration_tag }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations
    outputs:
      image_api: ${{ steps.set_docker_tags.outputs.docker_tag_sha }}
      image_migrations: ${{ steps.set_docker_tags.outputs.migration_tag }}

  opentofu:
    name: "OpenTofu"
    runs-on: ubuntu-latest
    needs: docker
    permissions:
      contents: "read"
      id-token: "write"
    defaults:
      run:
        working-directory: ./infrastructure
    outputs:
      migration_job_id: ${{ steps.capture_outputs.outputs.migration_job_id }}
      region: ${{ steps.capture_outputs.outputs.region }}
      organization_id: ${{ steps.capture_outputs.outputs.organization_id }}
      project_id: ${{ steps.capture_outputs.outputs.project_id }}
      api_hostname: ${{ steps.capture_outputs.outputs.api_hostname }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Environment Variables
        shell: bash
        run: |
          echo "TF_VAR_image_api=${{ needs.docker.outputs.image_api }}" >> $GITHUB_ENV
          echo "TF_VAR_image_migrations=${{ needs.docker.outputs.image_migrations }}" >> $GITHUB_ENV
          echo "SCW_ACCESS_KEY=${{ secrets.SCW_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "SCW_SECRET_KEY=${{ secrets.SCW_SECRET_KEY }}" >> $GITHUB_ENV
          echo "AWS_ACCESS_KEY_ID=${{ secrets.SCW_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.SCW_SECRET_KEY }}" >> $GITHUB_ENV

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.11.8

      - name: "Apply OpenTofu"
        uses: ./.github/workflows/opentofu
      - name: Capture deployment outputs
        id: capture_outputs
        run: |
          echo "migration_job_id=$(tofu output -raw migration_job_id)" >> "$GITHUB_OUTPUT"
          echo "region=$(tofu output -raw region)" >> "$GITHUB_OUTPUT"
          echo "organization_id=$(tofu output -raw organization_id)" >> "$GITHUB_OUTPUT"
          echo "project_id=$(tofu output -raw project_id)" >> "$GITHUB_OUTPUT"
          echo "api_hostname=$(tofu output -raw api_hostname)" >> "$GITHUB_OUTPUT"

  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest
    needs: opentofu
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          curl -fsSL https://raw.githubusercontent.com/scaleway/scaleway-cli/master/scripts/get.sh | SCW_VERSION=2.40.0 sh
      - name: Run Scaleway migration job
        timeout-minutes: 15
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ needs.opentofu.outputs.organization_id }}
          SCW_DEFAULT_PROJECT_ID: ${{ needs.opentofu.outputs.project_id }}
        run: |
          job_id='${{ needs.opentofu.outputs.migration_job_id }}'
          bash scripts/run-migration-job.sh "${job_id##*/}" "${{ needs.opentofu.outputs.region }}"

  smoke:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    needs: [migrate, opentofu]
    steps:
      - uses: actions/checkout@v4
      - name: Run post-deployment Playwright smoke tests
        env:
          BASE_URL: https://${{ needs.opentofu.outputs.api_hostname }}
        run: docker compose -p recoverboard-smoke -f src/docker-compose.yaml -f compose.test.yaml run --build --no-deps --rm -e PW_SUITE=smoke -e BASE_URL playwright npm run test:smoke
      - name: Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke
          path: artifacts/playwright/
          if-no-files-found: warn

